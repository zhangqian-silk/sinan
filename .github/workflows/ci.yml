name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # 没有抓取数据时，两条依赖真实题库的打标自检会自动跳过；
      # planner / store / CLI 的回归跑在入库的迷你夹具上，不需要网络。
      - run: node --test dist/test/*.test.js

  package:
    runs-on: ubuntu-latest
    name: 打包能装能跑
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 打包并在干净目录里安装
        run: |
          set -euo pipefail
          TGZ="$(npm pack --silent | tail -1)"
          WORK="$(mktemp -d)"
          cp "$TGZ" "$WORK/"
          cd "$WORK"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "./$TGZ"
          export SINAN_HOME="$WORK/home"
          # 装完什么都不做就该能用：分类体系、解题思路、题目和链接
          ./node_modules/.bin/sinan topics | grep -q "13 个大类"
          ./node_modules/.bin/sinan learn monotonic | grep -q "单调栈"
          ./node_modules/.bin/sinan list --tag monotonic | grep -q "leetcode.cn" \
            || ./node_modules/.bin/sinan list --tag monotonic --links | grep -q "leetcode.cn"
          ./node_modules/.bin/sinan plan monotonic | grep -q "学习计划"
          ./node_modules/.bin/sinan stats | grep -q "随包的精简题库"
          # 分发物里绝不能有题面原文
          if grep -rl "<p>" node_modules/sinan/baseline 2>/dev/null; then
            echo "基线数据里混进了题面 HTML" && exit 1
          fi
          test ! -d node_modules/sinan/data
          echo "运行时依赖：$(npm ls --omit=dev --parseable | wc -l) 个包（含自身）"
